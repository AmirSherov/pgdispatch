name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Python ${{ matrix.python }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        postgres: ["13", "14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      PGDISPATCH_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Run tests
        run: |
          uv run coverage run -m pytest
          uv run coverage combine
          uv run coverage report
          uv run coverage xml
      # Django skips its tests on PostgreSQL versions it no longer supports,
      # so the coverage threshold is enforced where the whole suite runs.
      - name: Enforce coverage
        if: matrix.postgres == '17'
        run: uv run coverage report --fail-under=90 > /dev/null
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13' && matrix.postgres == '17'
        with:
          name: coverage
          path: coverage.xml

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Check the wheel installs and imports
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check dist/*.whl
          /tmp/check/bin/pgdispatch --version
