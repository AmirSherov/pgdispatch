# The repository's settings, but with this directory as the project root, so
# that `orders` and `shop` are first-party and `django` and `pgdispatch` are
# third-party, as in any Django project that uses pgdispatch.
extend = "../../pyproject.toml"
src = ["."]

[lint.isort]
known-first-party = []

[lint.extend-per-file-ignores]
"*/migrations/*" = ["RUF012"]  # generated by Django
